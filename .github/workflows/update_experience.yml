name: Update Experience

on:
  schedule:
    - cron: '0 0 * * *'  # daily at midnight UTC
  workflow_dispatch:  # manual trigger

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Calculate experience (years + months) and update README
        run: |
          START_DATE="2018-06-18"
          TODAY=$(date +%Y-%m-%d)
      
          START_YEAR=$(date -d "$START_DATE" +%Y)
          START_MONTH=$((10#$(date -d "$START_DATE" +%m)))
          START_DAY=$((10#$(date -d "$START_DATE" +%d)))
      
          CUR_YEAR=$(date +%Y)
          CUR_MONTH=$((10#$(date +%m)))
          CUR_DAY=$((10#$(date +%d)))
      
          YEARS=$((CUR_YEAR - START_YEAR))
          MONTHS=$((CUR_MONTH - START_MONTH))
      
          if [ $MONTHS -lt 0 ]; then
            YEARS=$((YEARS - 1))
            MONTHS=$((MONTHS + 12))
          fi
      
          if [ $CUR_DAY -lt $START_DAY ]; then
            if [ $MONTHS -eq 0 ]; then
              YEARS=$((YEARS - 1))
              MONTHS=11
            else
              MONTHS=$((MONTHS - 1))
            fi
          fi
      
          if [ $MONTHS -eq 0 ]; then
            EXPERIENCE="$YEARS years"
          else
            EXPERIENCE="$YEARS years $MONTHS months"
          fi
      
          echo "Updating experience to $EXPERIENCE"
      
          sed -i "s/<!-- EXPERIENCE -->/$EXPERIENCE/" README.md
      
          git config user.name "Experience Updater Bot"
          git config user.email "experience-bot@users.noreply.github.com"
      
          if ! git diff --exit-code README.md; then
            git add README.md
            git commit -m "Update experience to $EXPERIENCE"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          else
            echo "No changes to commit"
          fi
